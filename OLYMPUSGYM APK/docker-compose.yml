services:
  api:
    build: ./olympusgym-api-node-express
    environment:
      PORT: 3000
      FRONTEND_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./olympusgym-frontend
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_USE_MOCKS: "false"
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

