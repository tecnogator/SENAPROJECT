cd "C:\Users\LENOVO\Downloads\olympusgym (1)"

# Actualizar application.properties con MySQL
@"
# ============================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/olympusgym?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA (HIBERNATE) CONFIGURACIÓN
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# PUERTO DEL SERVIDOR
# ============================================
server.port=8080

# ============================================
# LOGGING
# ============================================
logging.level.com.olympusgym=DEBUG
"@ | Out-File -FilePath "src\main\resources\application.properties" -Encoding ASCII

Write-Host "✅ application.properties configurado con MySQL" -ForegroundColor Green