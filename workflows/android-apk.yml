name: Validar y generar APK OlympusGym

on:
  workflow_dispatch:
  push:
    branches: [main, ga8-aa2-ev02-react-native]
    paths:
      - "olympusgym-mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: olympusgym-mobile

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Validar estructura móvil
        run: npm run validate

      - name: Generar proyecto Android nativo
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK de depuración instalable
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar artefacto
        run: |
          mkdir -p ../release
          cp android/app/build/outputs/apk/debug/app-debug.apk ../release/OlympusGym-GA8-AA2-EV02.apk
          cd ../release
          sha256sum OlympusGym-GA8-AA2-EV02.apk > OlympusGym-GA8-AA2-EV02.apk.sha256

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: OlympusGym-Android-APK
          path: |
            release/OlympusGym-GA8-AA2-EV02.apk
            release/OlympusGym-GA8-AA2-EV02.apk.sha256
          if-no-files-found: error
          retention-days: 30

